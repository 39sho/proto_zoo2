# Local development only. The credentials below are throwaway defaults and
# Electric runs in insecure (plain-HTTP) mode — do NOT use this as-is in
# production. See README for production notes.
name: proto-zoo2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: electric
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "54321:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electric"]
      interval: 5s
      timeout: 5s
      retries: 12

  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/electric?sslmode=disable
      # Required for plain-HTTP local development.
      ELECTRIC_INSECURE: "true"
      # Set ELECTRIC_LOG_LEVEL=debug in the shell (or root .env) to see per-shape
      # sync activity: ELECTRIC_LOG_LEVEL=debug docker compose up -d
      ELECTRIC_LOG_LEVEL: ${ELECTRIC_LOG_LEVEL:-info}
      # Uncomment to enable Electric's Phoenix LiveDashboard at :3002.
      # ELECTRIC_LIVE_DASHBOARD_PORT: "4000"
      # Uncomment ELECTRIC_SECRET below (and set the same value in server/.env)
      # to require a secret on every shape request. The Rust API proxy adds it.
      # ELECTRIC_SECRET: local-electric-secret
    ports:
      - "3001:3000"
      # - "3002:4000"   # LiveDashboard (requires ELECTRIC_LIVE_DASHBOARD_PORT)
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
